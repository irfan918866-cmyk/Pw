<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>PW GyanSarthi - Study Batches</title>
  
  <!-- PWA Manifest & App Identity -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0F1117" id="theme-color-meta" />
  <meta name="description" content="PW GyanSarthi Study Batches & Online Lectures Portal" />
  
  <!-- Apple iOS Web App Support -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PW GyanSarthi" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />

  <style>
    :root {
      --bg-dark: #0F1117;
      --bg-light: #F8FAFC;
      --text-dark: #FFFFFF;
      --text-light: #0F172A;
      --primary: #6366F1;
      --primary-hover: #4F46E5;
      --surface-dark: #1E2230;
      --surface-light: #FFFFFF;
      --border-dark: #2D3748;
      --border-light: #E2E8F0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-dark);
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    body.light-mode {
      background-color: var(--bg-light);
      color: var(--text-light);
    }

    #app-container {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    /* Top Progress Bar */
    #progress-bar {
      position: fixed;
      top: 0;
      left: 0;
      width: 0%;
      height: 3px;
      background: linear-gradient(90deg, #6366F1, #8B5CF6, #EC4899);
      z-index: 9999;
      transition: width 0.3s ease, opacity 0.3s ease;
      opacity: 0;
    }

    /* Fullscreen Webview Frame */
    #portal-frame {
      width: 100%;
      height: 100%;
      border: none;
      flex: 1;
      background-color: inherit;
    }

    /* Floating Action Controls */
    .floating-fab {
      position: fixed;
      z-index: 999;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
      border: 1px solid var(--border-dark);
      background: var(--surface-dark);
      color: #FFFFFF;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    body.light-mode .floating-fab {
      background: var(--surface-light);
      color: #0F172A;
      border-color: var(--border-light);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
    }

    .floating-fab:active {
      transform: scale(0.92);
    }

    /* Theme Toggle Button (Bottom Right) */
    #theme-btn {
      bottom: 24px;
      right: 20px;
      width: 46px;
      height: 46px;
      font-size: 20px;
    }

    /* Install App Prompt Banner */
    #install-banner {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #1E2230;
      color: #FFFFFF;
      border: 1px solid #374151;
      border-radius: 999px;
      padding: 10px 18px;
      display: none;
      align-items: center;
      gap: 10px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      z-index: 1000;
      font-size: 13.5px;
      font-weight: 600;
      opacity: 0;
      transition: all 0.3s ease;
    }

    #install-banner.show {
      display: flex;
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    #install-banner img {
      width: 22px;
      height: 22px;
      border-radius: 50%;
    }

    #install-banner button.action-btn {
      background: var(--primary);
      color: #FFFFFF;
      border: none;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    #install-banner button.action-btn:hover {
      background: var(--primary-hover);
    }

    #install-banner button.close-btn {
      background: none;
      border: none;
      color: #9CA3AF;
      font-size: 16px;
      cursor: pointer;
      line-height: 1;
      margin-left: 2px;
    }

    /* Offline Toast */
    #offline-banner {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: #EF4444;
      color: #FFFFFF;
      padding: 6px 16px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      display: none;
      z-index: 10000;
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
    }
  </style>
</head>
<body>

  <div id="progress-bar"></div>
  <div id="offline-banner">⚠️ You are offline. Check connection.</div>

  <div id="app-container">
    <iframe 
      id="portal-frame" 
      src="https://pw.deltaverse.site/study/batches" 
      title="PW GyanSarthi Batches"
      allow="fullscreen; autoplay; clipboard-write; encrypted-media; picture-in-picture"
      loading="eager"
    ></iframe>
  </div>

  <!-- Install PWA Banner -->
  <div id="install-banner">
    <img src="/icons/icon-192.png" alt="PW Logo" />
    <span>Install PW GyanSarthi App</span>
    <button class="action-btn" id="install-btn">Install</button>
    <button class="close-btn" id="close-install-btn">&times;</button>
  </div>

  <!-- Floating Light/Dark Mode Toggle -->
  <button class="floating-fab" id="theme-btn" aria-label="Toggle Light/Dark Mode" title="Toggle Light/Dark Mode">
    <span id="theme-icon">☀️</span>
  </button>

  <script>
    // 1. Service Worker Registration for PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then((reg) => console.log('PWA ServiceWorker registered:', reg.scope))
          .catch((err) => console.log('ServiceWorker registration failed:', err));
      });
    }

    // 2. Light / Dark Mode System
    const themeBtn = document.getElementById('theme-btn');
    const themeIcon = document.getElementById('theme-icon');
    const themeColorMeta = document.getElementById('theme-color-meta');
    
    // Check saved or system preference
    const savedTheme = localStorage.getItem('pw_theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    let isDark = savedTheme ? savedTheme === 'dark' : prefersDark;

    function applyTheme(dark) {
      isDark = dark;
      if (dark) {
        document.body.classList.remove('light-mode');
        themeIcon.textContent = '☀️';
        themeBtn.setAttribute('title', 'Switch to Light Mode');
        themeColorMeta.setAttribute('content', '#0F1117');
        localStorage.setItem('pw_theme', 'dark');
      } else {
        document.body.classList.add('light-mode');
        themeIcon.textContent = '🌙';
        themeBtn.setAttribute('title', 'Switch to Dark Mode');
        themeColorMeta.setAttribute('content', '#F8FAFC');
        localStorage.setItem('pw_theme', 'light');
      }

      // Propagate theme message to embedded portal
      try {
        const frame = document.getElementById('portal-frame');
        if (frame && frame.contentWindow) {
          frame.contentWindow.postMessage({ type: 'PW_THEME_CHANGE', theme: dark ? 'dark' : 'light' }, '*');
        }
      } catch (e) {}
    }

    applyTheme(isDark);

    themeBtn.addEventListener('click', () => {
      applyTheme(!isDark);
    });

    // 3. Simulated Top Progress Bar on Load
    const progressBar = document.getElementById('progress-bar');
    const portalFrame = document.getElementById('portal-frame');

    function startProgress() {
      progressBar.style.opacity = '1';
      progressBar.style.width = '30%';
      setTimeout(() => { progressBar.style.width = '70%'; }, 250);
    }

    function completeProgress() {
      progressBar.style.width = '100%';
      setTimeout(() => {
        progressBar.style.opacity = '0';
        setTimeout(() => { progressBar.style.width = '0%'; }, 300);
      }, 200);
    }

    startProgress();
    portalFrame.addEventListener('load', () => {
      completeProgress();
    });

    // 4. Native PWA "Add to Home Screen" Trigger
    let deferredPrompt;
    const installBanner = document.getElementById('install-banner');
    const installBtn = document.getElementById('install-btn');
    const closeInstallBtn = document.getElementById('close-install-btn');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      setTimeout(() => {
        installBanner.classList.add('show');
      }, 1500);
    });

    installBtn.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          console.log('User installed the PWA');
        }
        deferredPrompt = null;
        installBanner.classList.remove('show');
      }
    });

    closeInstallBtn.addEventListener('click', () => {
      installBanner.classList.remove('show');
    });

    window.addEventListener('appinstalled', () => {
      installBanner.classList.remove('show');
      console.log('PWA installed successfully');
    });

    // 5. Online / Offline Listener
    const offlineBanner = document.getElementById('offline-banner');
    window.addEventListener('offline', () => {
      offlineBanner.style.display = 'block';
    });
    window.addEventListener('online', () => {
      offlineBanner.style.display = 'none';
    });
  </script>
</body>
</html>
